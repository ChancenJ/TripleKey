<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>TripleKey更多设置</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <img class="logo" src="https://pic.imgdb.cn/item/663758470ea9cb1403f5e51f.png" alt="TripleKey">
    <h1>更多设置</h1>

    <form action="/clock" method="post">
    <div class="card">
        <div class="card-title">时钟设置</div>
        <div class="form-group">
            <div class="form-group-label">整点报时</div>
            <div class="radio-group">
                <label><input type="radio" name="clockaudio" value="yes" {{YESCHECKED_AUDIO}}> 是</label>
                <label><input type="radio" name="clockaudio" value="no" {{NOCHECKED_AUDIO}}> 否</label>
            </div>
        </div>
        <div class="form-group">
            <div class="form-group-label">时钟主题自动切换</div>
            <div class="radio-group">
                <label><input type="radio" name="clocktheme" value="yes" {{YESCHECKED_THEME}}> 是</label>
                <label><input type="radio" name="clocktheme" value="no" {{NOCHECKED_THEME}}> 否</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
    </div>
    </form>

    <form action="/encoder" method="post">
    <div class="card">
        <div class="card-title">旋转编码器设置</div>
        <div class="form-group">
            <div class="form-group-label">旋转编码器限位值</div>
            <div class="radio-group">
                <label><input type="radio" name="rotary" value="4" {{FOUR}}> 4</label>
                <label><input type="radio" name="rotary" value="2" {{TWO}}> 2</label>
            </div>
        </div>
        <div class="form-group">
            <div class="form-group-label">旋转编码器是否反向</div>
            <div class="radio-group">
                <label><input type="radio" name="reverse" value="yes" {{YESCHECKED_REVERSE}}> 是</label>
                <label><input type="radio" name="reverse" value="no" {{NOCHECKED_REVERSE}}> 否</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
    </div>
    </form>

    {{PHOTO_SECTION_BEGIN}}
    <form action="/photo" method="post">
    <div class="card">
        <div class="card-title">照片设置</div>
        <div class="form-group">
            <div class="form-group-label">自动轮播</div>
            <div class="radio-group">
                <label><input type="radio" name="photoscroll" value="1" {{YESCHECKED_SCROLL}}> 是</label>
                <label><input type="radio" name="photoscroll" value="0" {{NOCHECKED_SCROLL}}> 否</label>
            </div>
        </div>
        <div style="margin-bottom:12px;">
            <a class="btn btn-outline btn-sm" href="/uploadphoto">上传/删除照片</a>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
    </div>
    </form>
    {{PHOTO_SECTION_END}}

    <div style="text-align:center;margin-top:8px;">
        <a class="btn btn-outline" href="/">返回主页</a>
    </div>
</div>
</body>
</html>

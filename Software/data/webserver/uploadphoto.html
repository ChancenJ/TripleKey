<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>上传照片</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <img class="logo" src="https://pic.imgdb.cn/item/663758470ea9cb1403f5e51f.png" alt="TripleKey">
    <h1>上传照片</h1>

    <div class="card">
        <div class="card-title">存储空间</div>
        <button class="btn btn-outline btn-sm" onclick="ListROM()">查询剩余ROM（等待2秒）</button>
        <p id="rom" style="margin-top:8px;"></p>
    </div>

    <div class="card">
        <div class="card-title">照片格式说明</div>
        <div class="warning">png：宽高均小于等于128像素，最大128x128，尽量避免中文与特殊符号命名<br>
            jpg：宽高比例尽量接近1:1，高边像素应接近128整数倍，最大1024x1024（最佳大小128×128，更大尺寸徒增空间），尽量避免中文与特殊符号命名</div>
        <p class="note">上传后点击返回，对照片设置保存或重启设备，照片页将会刷新</p>
    </div>

    <div class="card">
        <div class="card-title">上传文件</div>
        <form method="POST" action="/upload?dir=photo" enctype="multipart/form-data">
            <div class="form-group">
                <input type="file" name="data" />
            </div>
            <button type="submit" class="btn btn-primary" name="Upload">上传</button>
        </form>
        <p id="status"></p>
    </div>

    <div class="card">
        <div class="card-title">已上传照片</div>
        <div id="filelist">{{FILELIST}}</div>
    </div>

    <div style="text-align:center;margin-top:8px;">
        <a class="btn btn-outline" href="/moresettings">返回</a>
    </div>
</div>

<script>
    function DeleteButton(filename) {
        var xmlhttp = new XMLHttpRequest();
        xmlhttp.open("GET", "/delete?dir=photo&name=" + filename, false);
        xmlhttp.send();
        document.getElementById("status").innerHTML = xmlhttp.responseText;
        xmlhttp.open("GET", "/listfiles?dir=photo&deletebutton=1", false);
        xmlhttp.send();
        document.getElementById("filelist").innerHTML = xmlhttp.responseText;
    }
    function ListROM() {
        var xmlhttp = new XMLHttpRequest();
        xmlhttp.open("GET", "/rom", false);
        xmlhttp.send();
        document.getElementById("rom").innerHTML = xmlhttp.responseText;
    }
</script>
</body>
</html>
